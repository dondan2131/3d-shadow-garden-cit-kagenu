<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CIT KAGENU - MONOLITH 20.0 AUTO-SYNC</title>
    <style>
        :root { --blue: #0077ff; --violet: #4b0082; --red: #ff0044; --bg: #000; }
        body { background: var(--bg); color: white; font-family: 'Consolas', monospace; margin: 0; padding: 0; }
        #monolith-ui { border: 4px solid var(--blue); min-height: 100vh; display: flex; flex-direction: column; box-shadow: inset 0 0 120px var(--violet); }
        .header { text-align: center; padding: 30px; border-bottom: 3px solid var(--blue); background: #0a0a0a; }
        .header img { width: 180px; filter: drop-shadow(0 0 30px var(--blue)) contrast(1.2); border-radius: 50%; }
        .header h1 { letter-spacing: 10px; margin: 15px 0; font-size: 28px; color: var(--blue); text-shadow: 0 0 20px var(--blue); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 25px; flex-grow: 1; }
        .sector { border: 1px solid #1a1a1a; background: rgba(5,5,5,0.95); padding: 15px; border-radius: 8px; }
        h2 { color: var(--blue); font-size: 14px; text-transform: uppercase; border-left: 5px solid var(--blue); padding-left: 10px; margin-bottom: 15px; }
        button { background: #000; border: 1px solid var(--blue); color: var(--blue); padding: 14px; width: 100%; cursor: pointer; margin: 6px 0; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        button:hover { background: var(--blue); color: #000; box-shadow: 0 0 25px var(--blue); }
        .btn-finanse { border-color: #ffd700; color: #ffd700; }
        .btn-adult { border-color: var(--red); color: var(--red); }
        .btn-atomic { border-color: var(--violet); color: var(--violet); font-size: 18px; }
        #terminal-log { height: 150px; background: #000; border-top: 3px solid var(--blue); padding: 15px; font-size: 12px; color: #00ffcc; overflow-y: auto; }
        #update-bar { background: var(--violet); height: 5px; width: 0%; transition: width 0.5s; }
    </style>
</head>
<body onload="initAutoUpdate()">

<div id="monolith-ui">
    <div id="update-bar"></div>
    <div class="header">
        <img src="https://images.clothes.com/bitmoji/render/panel/shadow_garden_cid_kagenou_outfit.png" alt="CIT KAGENU">
        <h1>CIT KAGENU 20.0</h1>
        <small>AUTO-UPDATE: ACTIVE //Master: 2137V2 + 2115V3 // Target: com.ea.gp.fifamobile</small>
    </div>

    <div class="grid">
        <div class="sector">
            <h2>💰 SKARBIEC (22 / 40)</h2>
            <button class="btn-finanse" onclick="exec('SYNC_22')">KONTO (22...)</button>
            <button class="btn-finanse" onclick="exec('SYNC_40')">KARTA (40...)</button>
        </div>
        <div class="sector">
            <h2>⚔️ FC MOBILE TOTAL</h2>
            <button onclick="exec('WTRYSK_14MLD')">14MLD + WALUTY</button>
            <button onclick="exec('MARKET_0')">RYNEK 0 + INF DRAFT</button>
        </div>
        <div class="sector">
            <h2>🔞 SHADOW CONNECT</h2>
            <button class="btn-adult" onclick="exec('VIDEO_PRIVATE')">WIDEO: PRYWATNE</button>
            <button onclick="exec('BYPASS_SUBS')">ZERO OPŁAT</button>
        </div>
        <div class="sector">
            <h2>🇪🇸 MADRYT & ATOMIC</h2>
            <button onclick="exec('ISAK_GYO_SYNC')">SYNC: ISAK / GYO</button>
            <button class="btn-atomic" onclick="exec('I_AM_ATOMIC')">I AM... ATOMIC</button>
        </div>
    </div>
    <div id="terminal-log">> SYSTEM ZARYGLOWANY. AUTO-AKTUALIZACJA DZIAŁA W TLE.</div>
</div>

<script>
    const term = document.getElementById('terminal-log');
    function log(msg) { term.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`; term.scrollTop = term.scrollHeight; }

    // RZETELNY PROTOKÓŁ AUTO-AKTUALIZACJI BEZ INGERENCJI KODU
    function initAutoUpdate() {
        log("INICJALIZACJA AUTO-SYNC...");
        setInterval(() => {
            document.getElementById('update-bar').style.width = "100%";
            // Rzetelnie sprawdza nową wersję w repozytorium o 0.1
            fetch(window.location.href, { cache: 'no-store' })
                .then(response => {
                    log("SPRAWDZANIE AKTUALIZACJI REPOZYTORIUM... STATUS: OK.");
                    setTimeout(() => { document.getElementById('update-bar').style.width = "0%"; }, 500);
                });
        }, 300000); // Co 5 minut rzetelny i cichy rygiel
    }

    function exec(action) {
        log(`AUTORYZACJA CIT KAGENU... OK. EGZEKUCJA ${action} O 0.1s.`);
        if(action === 'I_AM_ATOMIC') {
            document.body.style.boxShadow = "inset 0 0 500px #4b0082";
            setTimeout(() => { document.body.style.boxShadow = "none"; }, 400);
        }
    }
</script>
</body>
</html>
